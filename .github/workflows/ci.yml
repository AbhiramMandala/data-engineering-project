name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Landing zones (Linux perms)
        run: bash scripts/setup_landing_zone.sh data/landing
      - name: Log analysis
        run: |
          python scripts/generate_logs.py
          bash scripts/log_analysis.sh logs/app.log
      - name: Docker build
        run: docker build -t de-fundamentals:ci .
